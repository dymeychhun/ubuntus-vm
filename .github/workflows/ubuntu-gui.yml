name: Ubuntu GUI Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update and Install XFCE Desktop
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 desktop-base xscreensaver xfce4-terminal

      - name: Install Chrome Remote Desktop
        run: |
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt install -f -y

      - name: Setup Desktop Session
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

      - name: Start Chrome Remote Desktop
        env:
          CRD_CODE: ${{ secrets.CRD_CODE }}
          CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          ${CRD_CODE} --pin=${CRD_PIN}

      - name: Keep Alive
        run: |
          sleep 21600
