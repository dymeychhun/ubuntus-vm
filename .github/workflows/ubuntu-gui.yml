name: Ubuntu GUI (RustDesk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install XFCE Desktop
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 desktop-base xscreensaver xfce4-terminal

      - name: Install RustDesk
        run: |
          wget -q https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.deb
          sudo apt install -y ./rustdesk-1.3.7-x86_64.deb

      - name: Start Virtual Display & RustDesk
        run: |
          sudo apt install -y xvfb
          Xvfb :1 -screen 0 1280x720x24 &
          export DISPLAY=:1
          xfce4-session &
          
          # កំណត់ Password សម្រាប់ RustDesk
          sudo rustdesk --password 123456
          
          # ទាញយក ID របស់ម៉ាស៊ីន
          sleep 5
          echo "=================================================="
          echo "RustDesk ID: $(rustdesk --get-id)"
          echo "Password: 123456"
          echo "=================================================="

      - name: Keep Alive
        run: |
          sleep 21600
