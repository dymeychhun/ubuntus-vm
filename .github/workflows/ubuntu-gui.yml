name: Ubuntu GUI (RustDesk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop & Dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 desktop-base xfce4-terminal xvfb dbus-x11 at-spi2-core

      - name: Install RustDesk
        run: |
          wget -q https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.deb
          sudo apt install -y ./rustdesk-1.3.7-x86_64.deb

      - name: Start Display & RustDesk Service
        run: |
          # បង្កើត Display និម្មិត
          Xvfb :1 -screen 0 1280x720x24 &
          export DISPLAY=:1
          
          # បើកដំណើរការ D-Bus និង XFCE Desktop
          dbus-launch --exit-with-session startxfce4 &
          sleep 3

          # ចាប់ផ្ដើម RustDesk Service ភ្ជាប់ជាមួយ Display :1
          sudo systemctl restart rustdesk || true
          rustdesk --service &
          
          # កំណត់ Password
          sudo rustdesk --password 123456
          sleep 5

          echo "=================================================="
          echo "RustDesk ID: $(rustdesk --get-id)"
          echo "Password: 123456"
          echo "=================================================="

      - name: Keep Alive
        run: |
          sleep 21600
